<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الكاشير | طلبك جاهز</title>
<style>
  :root { --brand:#0f3d2e; --ok:#1f8a4c; --warn:#b4541a; --bad:#a32020; --muted:#5b6b64; }
  body { margin:0; font-family:-apple-system,"SF Arabic","Segoe UI",Tahoma,sans-serif; background:#f6f3ee; color:#13201b; }
  .top { display:flex; gap:16px; align-items:center; padding:16px 20px; background:#fff; border-bottom:1px solid #e6e1d8; flex-wrap:wrap; }
  .top h1 { font-size:20px; margin:0; flex:1; }
  .cafeqr { display:flex; gap:10px; align-items:center; font-size:13px; color:var(--muted); }
  .cafeqr img { width:84px; height:84px; }
  button { font-family:inherit; border:0; border-radius:12px; padding:12px 18px; font-size:17px; font-weight:700; cursor:pointer; }
  .new { background:var(--brand); color:#fff; font-size:19px; padding:14px 26px; }
  .list { padding:16px 20px; display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:14px; }
  .card { background:#fff; border-radius:16px; padding:14px; display:grid; grid-template-columns:96px 1fr; gap:12px; }
  .card img { width:96px; height:96px; }
  .n { font-size:34px; font-weight:800; font-variant-numeric:tabular-nums; }
  .st { font-size:14px; font-weight:700; padding:3px 10px; border-radius:20px; display:inline-block; margin-inline-start:6px; vertical-align:middle; }
  .waiting { background:#fff1dc; color:#8a5a12; } .ready { background:#d8f5e3; color:var(--ok); } .picked { background:#eee; color:#666; }
  .ch { font-size:13px; line-height:1.7; color:var(--muted); }
  .ch .g { color:var(--ok); font-weight:700; } .ch .w { color:var(--warn); font-weight:700; } .ch .b { color:var(--bad); font-weight:700; }
  .acts { grid-column:1/-1; display:flex; gap:8px; }
  .acts button { flex:1; }
  .r { background:var(--ok); color:#fff; } .p { background:#e9e5dd; color:#333; }
  .tl { font-size:14px; font-weight:700; margin:4px 0; } .tl.g { color:var(--ok); } .tl.y { color:var(--warn); } .tl.r { color:var(--bad); }
  details { grid-column:1/-1; font-size:12px; color:var(--muted); } details pre { white-space:pre-wrap; margin:6px 0 0; direction:ltr; text-align:left; }
</style>
</head>
<body>
<div class="top">
  <h1>{{CAFE}} — لوحة الكاشير</h1>
  <div class="cafeqr"><img src="/qr/cafe.svg" alt=""><div>رمز ثابت للمقهى<br>يختار منه العميل رقم طلبه</div></div>
  <div class="cafeqr"><img src="/qr/app.svg" alt=""><div>رمز التسجيل مرة واحدة<br>يخلي الجوال يهتز ويضيء</div></div>
  <a href="/sticker" target="_blank" style="font:700 15px Tahoma;color:#0f3d2e;padding:10px">ملصق الكاونتر مع رمز الواي فاي</a>
  <a href="/board" target="_blank" style="font:700 15px Tahoma;color:#0f3d2e;padding:10px">شاشة الطلبات للكاونتر</a>
  <span style="display:inline-flex;gap:6px;align-items:center"><input id="phone" type="tel" placeholder="جوال العميل (اختياري)" style="font:16px Tahoma;padding:10px;border:1px solid #ccc;border-radius:10px;width:190px;direction:ltr"><button class="new" id="new">طلب جديد</button></span>
  <span id="devs" style="font:14px Tahoma;color:#5b6b64"></span>
</div>
<div class="list" id="list"></div>
<script>
const $ = s => document.getElementById(s);
const post = (u, b) => fetch(u, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(b||{}) }).then(r=>r.json());
$('new').onclick = () => post('/api/orders', { phone: $('phone').value }).then(() => { $('phone').value = ''; load(); });
const LBL = { waiting:'قيد التحضير', ready:'جاهز', picked:'تم التسليم' };
function audioState(o) {
  if (!o.streams.length) return '<span class="w">لا يوجد بث صوتي متصل</span>';
  return o.streams.map(s => s.blocked && s.lastDrainAgoSec > 8
    ? `<span class="b">البث متصل لكن الجهاز توقف عن القراءة منذ ${s.lastDrainAgoSec} ث</span>`
    : `<span class="g">الجهاز يسحب البث الصوتي</span> (${s.ageSec} ث)`).join('<br>');
}
// إشارة مرور: هل يمكن الوصول لجوال العميل الآن؟ تحسم قبل أن يبتعد عن الكاشير
function reach(o) {
  if (o.table) return `<div class="tl g">🪑 طاولة ${o.table}: وصّل الطلب للطاولة، لا يحتاج تنبيها</div>` + (o.status !== 'waiting' ? '' : '');
  if (o.status !== 'waiting') return '';
  const live = o.streams.some(s => !(s.blocked && s.lastDrainAgoSec > 8));
  if (o.linkedDevices || o.pushCount) return '<div class="tl g">🟢 يرن ويهتز حتى والجوال مقفل</div>';
  if (live) return '<div class="tl y">🟡 صوت فقط' + (o.heard ? '' : '، ولم يؤكد أنه يسمع') + '. إذا كان صوته مقفلا فأرشده لشاشة الطلبات</div>';
  return '<div class="tl r">🔴 جواله غير متصل. نبّهه الآن: شاشة الطلبات أو جهاز نداء احتياطي</div>';
}
function card(o) {
  const t = new Date(o.createdAt).toLocaleTimeString('ar-SA', { hour:'2-digit', minute:'2-digit' });
  const ev = o.events.map(e => `${new Date(e.t).toLocaleTimeString('en-GB')}  ${e.type}${Object.keys(e).length>2?' '+JSON.stringify(Object.fromEntries(Object.entries(e).filter(([k])=>k!=='t'&&k!=='type'))):''}`).join('\n');
  return `<div class="card">
    <a href="/o/${o.id}" target="_blank"><img src="/qr/${o.id}.svg" alt=""></a>
    <div><div><span class="n">${o.number}</span><span class="st ${o.status}">${LBL[o.status]}</span></div>${reach(o)}
      <div class="ch">${t} · ${audioState(o)}<br>
        جوال العميل: ${o.linkedDevices ? `<span class="g">مسجل ✅ يوصله إشعار يرن ويهتز</span>` : (o.phoneTail ? `<span class="w">…${o.phoneTail} غير مسجل</span>` : 'لم يُدخل')}<br>
        الصوت: ${o.heard ? '<span class="g">العميل أكد أنه سمع</span>' : '<span class="w">لم يؤكد</span>'} · اهتزاز: ${o.pushCount ? `<span class="g">مفعل${o.pushApple ? ' (ايفون)' : ''}</span>` : 'لا'} · App Clip: ${o.apnsCount ? '<span class="g">مسجل</span>' : 'لا'}
        ${o.reactionSec != null ? `<br>استجاب العميل بعد <span class="g">${o.reactionSec} ث</span> من إعلان الجاهزية` : ''}</div></div>
    <div class="acts">
      ${o.status==='waiting' ? `<button class="r" onclick="post('/api/orders/${o.id}/ready').then(load)">جاهز</button>` : ''}
      ${o.status!=='picked' && !o.table ? `<button class="p" onclick="const t=prompt('رقم الطاولة'); if(t) post('/api/orders/${o.id}/table',{table:t}).then(load)">طاولة</button>` : ''}
      ${o.status!=='picked' ? `<button class="p" onclick="post('/api/orders/${o.id}/picked').then(load)">تم التسليم</button>` : ''}
    </div>
    <details><summary>سجل الأحداث</summary><pre>${ev}</pre></details>
  </div>`;
}
let openDetails = new Set();
async function load() {
  document.querySelectorAll('details[open]').forEach(d => openDetails.add(d.parentElement.querySelector('a').href));
  const l = await fetch('/api/orders').then(r=>r.json());
  $('list').innerHTML = l.map(card).join('');
  document.querySelectorAll('.card').forEach(c => { if (openDetails.has(c.querySelector('a').href)) c.querySelector('details').open = true; });
  openDetails = new Set();
}
const TR = { ok: 'وصل بصوت أو اهتزاز ✅', silent: 'وصل بدون صوت', none: 'ما وصل' };
async function loadDevs() { try { const d = await fetch('/api/devices').then(r=>r.json());
  $('devs').innerHTML = `جوالات مسجلة: <b>${d.filter(x=>x.subs).length}</b>` + d.map(x => `<br>${x.apple ? 'ايفون' : 'أندرويد'} ${x.phoneTail ? '…' + x.phoneTail : 'بدون رقم'} · ${x.subs ? 'مشترك' : 'غير مشترك'} · ${x.log.some(e=>e.state==='sw_notification_shown') ? 'عرض الإشعار ✅' : ''} ${x.lastTest ? '· رأي العميل: ' + (TR[x.lastTest] || x.lastTest) : ''}`).join(''); } catch {} }
load(); setInterval(load, 1500); loadDevs(); setInterval(loadDevs, 5000);
</script>
</body>
</html>
